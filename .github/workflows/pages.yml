name: Site

# MD Drums' download page on GitHub Pages: site/index.html, with the editor's screenshots and the Inter faces the
# skin bundles. The page finds the latest md-drums-vX.Y.Z release's files through GitHub's API.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p _site/images _site/fonts
          cp site/index.html _site/
          cp docs/images/*.png _site/images/
          skin=source/elektron/md/mdDrumsPlugin/skins/mdDrums
          cp "$skin/Inter-Regular.ttf" "$skin/Inter-Medium.ttf" "$skin/Inter-SemiBold.ttf" "$skin/Inter-OFL.txt" _site/fonts/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
